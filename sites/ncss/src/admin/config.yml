backend:
  name: github
  repo: pdavlin/veil-ncss-monorepo
  branch: main
  # Shared Cloudflare Workers OAuth proxy, NCSS brand host — see
  # docs/cms-decision.md (amendment 2026-10-23). base_url must match the
  # worker's custom-domain route in auth/cf-worker/wrangler.toml.
  base_url: https://auth.ncss.build
  auth_endpoint: auth

# Uploads land in the repo. The {% image %} shortcode resolves any /-rooted
# path under src/, so uploaded images get the same avif/webp pipeline as the
# committed ones. Fields with choose_url: false keep existing paths as-is.
media_folder: sites/ncss/src/assets/uploads
public_folder: /assets/uploads

site_url: https://ncss.build
display_url: https://ncss.build

# Both brands share one CMS skeleton: an entry for a shared layout has the
# same fields on Veil and NCSS, apart from paths, labels, and defaults.
# scripts/cms-parity.ts checks this, and checks every content file's
# frontmatter against its entry.
collections:
  - name: pages
    label: Pages
    files:
      # Home is intentionally not in the CMS (decision 2026-09-14, confirmed
      # 2026-10-23). It holds the most layout-coupled data: hero video,
      # parallax bands, and form wiring. Edit src/content/index.md in code.

      - file: sites/ncss/src/content/capabilities.md
        label: Capabilities
        name: capabilities
        fields:
          - { name: layout, label: Layout, widget: hidden, default: layouts/services.njk }
          - { name: permalink, label: Permalink, widget: hidden, default: "/capabilities/" }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text, required: false }
          - { name: titleText, label: Title text, widget: string, default: capabilities }
          - { name: intro, label: Intro, widget: markdown, required: false }
          - name: drawing
            label: Technical drawing
            widget: object
            required: false
            fields:
              - name: image
                label: Image
                widget: object
                fields:
                  - { name: src, label: Image, widget: image, choose_url: false }
                  - { name: alt, label: Alt, widget: string }
              - { name: label, label: Label, widget: string, required: false }
              - { name: caption, label: Caption, widget: text, required: false }
          - name: services
            label: Capabilities
            widget: list
            required: false
            fields:
              - { name: number, label: Number, widget: number }
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: markdown }
          - name: ctaBand
            label: CTA Band
            widget: object
            required: false
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: markdown, required: false }
              - name: cta
                label: CTA
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: URL (page or PDF), widget: string }

      - file: sites/ncss/src/content/manufacturers.md
        label: Manufacturers
        name: manufacturers
        fields:
          - { name: layout, label: Layout, widget: hidden, default: layouts/manufacturers.njk }
          - { name: permalink, label: Permalink, widget: hidden, default: "/manufacturers/" }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text, required: false }
          - { name: titleText, label: Title text, widget: string, default: manufacturers, required: false }
          - { name: intro, label: Intro, widget: markdown, required: false }
          - name: categories
            label: Categories
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: navLabel, label: Menu label, widget: string, required: false, hint: 'Optional shorter name for the product lines menu. Leave empty to use the title.' }
              - { name: body, label: Body, widget: markdown, required: false }
              - name: groups
                label: Manufacturer groups
                widget: list
                required: false
                summary: "{{fields.heading}}"
                hint: 'Most categories need one group with no heading. Add a heading to split a category, for example Hardware and Fabric.'
                fields:
                  - { name: heading, label: 'Group heading (e.g. "Hardware")', widget: string, required: false }
                  - name: items
                    label: Manufacturers
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - { name: name, label: Company name, widget: string, hint: 'Shows under the logo.' }
                      - { name: logo, label: Logo image, widget: image, choose_url: false }
              - { name: note, label: Note under the logos, widget: string, required: false }

      - file: sites/ncss/src/content/research.md
        label: Research
        name: research
        fields:
          - { name: layout, label: Layout, widget: hidden, default: layouts/innovation.njk }
          - { name: permalink, label: Permalink, widget: hidden, default: "/research/" }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text, required: false }
          - { name: titleText, label: Title text, widget: string, default: research }
          - { name: intro, label: Intro, widget: markdown, required: false }
          - name: articles
            label: Articles
            widget: list
            fields:
              - { name: category, label: Category, widget: string, required: false }
              - { name: title, label: Title, widget: string }
              - { name: author, label: Author, widget: string, required: false }
              - name: image
                label: Image
                widget: object
                fields:
                  - { name: src, label: Image, widget: image, choose_url: false }
                  - { name: alt, label: Alt, widget: string }
              - { name: summary, label: Summary, widget: markdown, required: false }
              - { name: takeaways, label: Takeaways, widget: list, field: { name: item, label: Item, widget: string }, required: false }
              - { name: href, label: Link, widget: string, required: false }
              - { name: side, label: Image side, widget: select, options: ['left', 'right'], default: 'left', required: false }

      - file: sites/ncss/src/content/about.md
        label: About
        name: about
        fields:
          - { name: layout, label: Layout, widget: hidden, default: layouts/about.njk }
          - { name: permalink, label: Permalink, widget: hidden, default: "/about/" }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text, required: false }
          - name: hero
            label: Hero
            widget: object
            required: false
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: markdown, required: false }
              - { name: titleMark, label: Use lowercase-period title?, widget: boolean, default: true }
              - { name: overlayPosition, label: Overlay position, widget: select, options: ['left', 'center'], default: 'left' }
              - name: video
                label: Video
                widget: object
                required: false
                fields:
                  - { name: src, label: Video, widget: file, choose_url: false, hint: 'MP4 (H.264) only. Keep it under 20 MB: every upload stays in the site repository.' }
                  - { name: poster, label: Poster image, widget: image, choose_url: false, required: false }
                  - { name: alt, label: Alt, widget: string }
          - { name: body, label: Body, widget: markdown }

      - file: sites/ncss/src/content/offices.md
        label: Offices
        name: offices
        fields:
          - { name: layout, label: Layout, widget: hidden, default: layouts/offices.njk }
          - { name: permalink, label: Permalink, widget: hidden, default: "/offices/" }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text, required: false }
          - { name: titleText, label: Title text, widget: string, default: offices }
          - { name: intro, label: Intro, widget: markdown, required: false }
          - name: offices
            label: Offices
            widget: list
            fields:
              - { name: name, label: City / market name, widget: string }
              - { name: address, label: Address, widget: text, required: false, hint: 'Optional. One line per address line.' }
              - name: image
                label: Photo
                widget: object
                required: false
                fields:
                  - { name: src, label: Image, widget: image, choose_url: false }
                  - { name: alt, label: Alt, widget: string, required: false }

      - file: sites/ncss/src/content/team.md
        label: Team
        name: team
        fields:
          - { name: layout, label: Layout, widget: hidden, default: layouts/team.njk }
          - { name: permalink, label: Permalink, widget: hidden, default: "/team/" }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text, required: false }
          - { name: titleText, label: Title text, widget: string, default: team }
          - { name: intro, label: Intro, widget: markdown, required: false }
          - name: bioLayout
            label: Grid layout
            widget: select
            required: false
            default: stacked
            hint: 'Pairs puts two members per row on wide screens (photo, bio, photo, bio).'
            options:
              - { label: 'One member per row', value: stacked }
              - { label: 'Two members per row', value: pairs }
          - name: bios
            label: Team members
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Title / role, widget: string, required: false }
              - { name: credentials, label: Accreditations, widget: text, required: false, hint: 'One per line.' }
              - name: portrait
                label: Photo
                widget: object
                required: false
                fields:
                  - { name: src, label: Image, widget: image, choose_url: false }
                  - { name: alt, label: Alt, widget: string }
              - name: signature
                label: Signature image
                widget: object
                required: false
                fields:
                  - { name: src, label: Image, widget: image, choose_url: false }
                  - { name: alt, label: Alt, widget: string }
              - { name: body, label: Bio, widget: markdown, required: false }
              - { name: email, label: Email, widget: string, required: false }
              - { name: phone, label: Phone, widget: string, required: false }
              - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
              - { name: side, label: Photo side (desktop), widget: select, options: ['left', 'right'], default: 'left', required: false }

      - file: sites/ncss/src/content/portfolio/index.md
        label: Portfolio Index
        name: portfolio_index
        fields:
          - { name: layout, label: Layout, widget: hidden, default: layouts/portfolio-grid.njk }
          - { name: permalink, label: Permalink, widget: hidden, default: "/portfolio/" }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text, required: false }
          - { name: titleText, label: Title text, widget: string, default: portfolio }
          - { name: intro, label: Intro, widget: string, required: false }

      - file: sites/ncss/src/content/contact.md
        label: Contact
        name: contact
        fields:
          - { name: layout, label: Layout, widget: hidden, default: layouts/contact.njk }
          - { name: permalink, label: Permalink, widget: hidden, default: "/contact/" }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text, required: false }
          - { name: titleText, label: Title text, widget: string, default: contact }
          - { name: intro, label: Intro copy, widget: markdown, required: false }
          - name: mapBlock
            label: Map block
            widget: object
            required: false
            collapsed: true
            hint: 'Optional. Shows when Address is filled in.'
            fields:
              - { name: heading, label: Heading, widget: string, required: false }
              - { name: address, label: Address, widget: text, required: false, hint: 'One line per address line.' }
              - { name: href, label: Map link override, widget: string, required: false, hint: 'Leave blank to link to a map search for the address.' }
              - { name: linkLabel, label: Link text, widget: string, required: false, default: 'Open in maps' }
              - name: image
                label: Static map image
                widget: object
                required: false
                fields:
                  - { name: src, label: Image, widget: image, choose_url: false }
                  - { name: alt, label: Alt, widget: string, required: false }

  # Folder collection — one entry per project markdown file. Fields are FLAT
  # (top level), matching the frontmatter contract in
  # layouts/portfolio-detail.njk.
  - name: projects
    label: Portfolio Projects
    folder: sites/ncss/src/content/portfolio
    create: true
    slug: "{{slug}}"
    filter: { field: layout, value: layouts/portfolio-detail.njk }
    fields:
      - { name: layout, label: Layout, widget: hidden, default: layouts/portfolio-detail.njk }
      - { name: title, label: Project name, widget: string }
      - { name: date, label: Date added, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', hint: 'Drives ordering — newest first.' }
      - { name: location, label: Location, widget: string, required: false, hint: 'e.g. "Omaha, NE"' }
      - { name: brands, label: 'Site visibility (legacy)', widget: select, multiple: true, options: ['veil', 'ncss'], required: false, hint: 'Leave empty to show on this site. Only used by projects carried over from the shared-content era.' }
      - name: cardImage
        label: Card image
        widget: object
        required: false
        hint: 'Projects without a card image are hidden from the portfolio grid and home page.'
        fields:
          - { name: src, label: Image, widget: image, choose_url: false }
          - { name: alt, label: Alt, widget: string }
      - name: featuredVideo
        label: Featured video
        widget: object
        required: false
        hint: 'Optional. Leave empty for no video. Upload an MP4, or paste a YouTube link. Display style sets how an MP4 shows at the top of the page.'
        fields:
          - { name: src, label: Video, widget: file, choose_url: false, required: false, hint: 'MP4 (H.264) only. Keep it under 20 MB: every upload stays in the site repository.' }
          - { name: youtube, label: YouTube link, widget: string, required: false, hint: 'Optional. Paste the link from the YouTube Share button. If set, the page shows a YouTube player under the title and ignores the MP4 and display style.' }
          - { name: poster, label: Poster image, widget: image, choose_url: false, required: false, hint: 'Shows before the video plays, and in place of the video for visitors who turn off motion.' }
          - { name: alt, label: Alt text, widget: string }
          - name: style
            label: Display style
            widget: select
            required: false
            default: hero
            hint: 'Hero: full width, autoplays behind the project title. Inline: a smaller player with controls under the title.'
            options:
              - { label: 'Hero (full width, behind the title)', value: hero }
              - { label: 'Inline (small player under the title)', value: inline }
      - name: metadata
        label: Project metadata
        widget: list
        required: false
        hint: 'Quick facts — architect, engineer, contractor, awards.'
        fields:
          - { name: label, label: Label, widget: string }
          - { name: value, label: Value, widget: string }
      # Each item stores `type: image` or `type: video`, so an image item gets
      # the image picker and a video item gets the file picker.
      - name: media
        label: Project media (images or video)
        widget: list
        required: false
        typeKey: type
        types:
          - name: image
            label: Image
            widget: object
            summary: "{{fields.alt}}"
            fields:
              - { name: src, label: Image, widget: image, choose_url: false }
              - { name: alt, label: Alt, widget: string }
          - name: video
            label: Video
            widget: object
            summary: "{{fields.alt}}"
            fields:
              - { name: src, label: Video, widget: file, choose_url: false, hint: 'MP4 (H.264) only. Keep it under 20 MB: every upload stays in the site repository.' }
              - { name: poster, label: Poster image, widget: image, choose_url: false, required: false }
              - { name: alt, label: Alt, widget: string }
      - { name: mediaCredit, label: Media credit, widget: string, required: false }
      - { name: body, label: Project write-up, widget: markdown }
